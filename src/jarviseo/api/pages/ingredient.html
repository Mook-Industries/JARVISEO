<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자비서 · 성분 확인</title>
<style>
  :root { --bg:#0e1116; --card:#171b22; --line:#2a303a; --text:#e8ebf0; --sub:#9aa3af;
          --accent:#5ab0ff; --warn:#ffb454; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--sub); margin: 0 0 20px; font-size: 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size: 15px; margin: 0 0 10px; color: var(--sub); font-weight: 600; }
  .row { display:flex; gap:8px; }
  input[type=text] { flex:1; min-width:0; background:#0b0e13; color:var(--text); border:1px solid var(--line);
                     border-radius:10px; padding:10px 12px; font-size:15px; }
  button { background:var(--accent); color:#06121f; border:0; border-radius:10px; padding:10px 16px;
           font-size:15px; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  .hint { color: var(--sub); font-size: 13px; margin-top: 8px; min-height: 1em; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center;
          color:var(--sub); cursor:pointer; }
  #drop.over { border-color: var(--accent); color: var(--text); }
  #preview { display:none; max-width:100%; max-height:320px; margin:12px auto 0; border-radius:10px; }
  #analyze { width:100%; margin-top:12px; padding:14px; font-size:16px; }
  #sentence { font-size: 20px; line-height: 1.5; margin: 0 0 12px; }
  #sentence.warn { color: var(--warn); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:#0b0e13; border:1px solid var(--line); border-radius:999px; padding:4px 10px;
          font-size:13px; color:var(--sub); }
  .chip.cut { border-color: var(--warn); color: var(--warn); }
  #result { display:none; }
</style>
</head>
<body>
<main>
  <h1>성분 확인</h1>
  <p class="sub">제품의 바코드나 성분표 사진을 올리면, 등록한 알레르기가 들어 있는지 알려 드려요.</p>

  <section class="card">
    <h2>내 알레르기</h2>
    <div class="row">
      <input id="allergens" type="text" placeholder="예: 계란, 땅콩, 새우">
      <button id="save" class="ghost">저장</button>
    </div>
    <div id="allergen-hint" class="hint"></div>
  </section>

  <section class="card">
    <h2>사진</h2>
    <div id="drop">여기를 눌러 사진을 고르거나, 사진을 끌어다 놓으세요</div>
    <input id="file" type="file" accept="image/*" hidden>
    <img id="preview" alt="올린 사진">
    <button id="analyze" disabled>분석하기</button>
    <div id="status" class="hint"></div>
  </section>

  <section id="result" class="card">
    <h2>결과</h2>
    <p id="sentence"></p>
    <div id="chips" class="chips"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let photo = null;

const names = () => $("allergens").value.split(/[,\s]+/).map((s) => s.trim()).filter(Boolean);

async function loadAllergens() {
  const list = (await (await fetch("/api/allergens")).json()).allergens;
  $("allergens").value = list.join(", ");
  $("allergen-hint").textContent = list.length ? `등록됨: ${list.join(", ")}` : "아직 등록된 알레르기가 없어요.";
}

$("save").onclick = async () => {
  const r = await fetch("/api/allergens", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ allergens: names() }),
  });
  const list = (await r.json()).allergens;
  $("allergen-hint").textContent = list.length ? `저장했어요: ${list.join(", ")}` : "모두 지웠어요.";
};

function choose(file) {
  if (!file || !file.type.startsWith("image/")) return;
  photo = file;
  $("preview").src = URL.createObjectURL(file);
  $("preview").style.display = "block";
  $("analyze").disabled = false;
  $("status").textContent = "";
}

$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => choose(e.target.files[0]);
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); choose(e.dataTransfer.files[0]); };

$("analyze").onclick = async () => {
  if (!photo) return;
  if (!names().length) { $("status").textContent = "알레르기를 먼저 입력해 주세요."; return; }
  $("analyze").disabled = true;
  $("status").textContent = "분석 중이에요… 성분표를 읽어야 하면 몇 초 걸려요.";
  try {
    const q = encodeURIComponent(names().join(","));
    const r = await fetch(`/api/ingredient?allergens=${q}`, {
      method: "POST", headers: { "Content-Type": photo.type || "application/octet-stream" }, body: photo,
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    show(d);
    $("status").textContent = "";
  } catch (err) {
    $("status").textContent = `분석하지 못했어요: ${err.message}`;
  } finally {
    $("analyze").disabled = false;
  }
};

function chip(text, cls = "chip") {
  return Object.assign(document.createElement("span"), { className: cls, textContent: text });
}

function show(d) {
  $("result").style.display = "block";
  $("sentence").textContent = d.sentence;
  const warn = ["contains", "may_contain"].includes(d.verdict) || d.occlusion;
  $("sentence").className = warn ? "warn" : "";
  $("chips").replaceChildren(chip(`판정: ${d.source_name}`), chip(`${(d.elapsed_ms / 1000).toFixed(1)}초`));
  if (d.product) $("chips").append(chip(`제품: ${d.product}`));
  if (d.barcode) $("chips").append(chip(`바코드 ${d.barcode}`));
  if (d.occlusion) $("chips").append(chip("성분표 일부가 잘림", "chip cut"));
}

loadAllergens();
</script>
</body>
</html>
