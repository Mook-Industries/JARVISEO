# 클라우드 서버(AWS EC2, 서울) 운영용 compose.  담당: 문태현 (배포)
#
# 개발용 docker-compose.yml 과 따로 둔다. 여기서는
#   - 팀 웹(api/main.py: 대시보드 · 물어보기 · 성분 확인)을 띄운다(#179). 이미지는 GitHub Actions 가
#     Dockerfile.web 으로 빌드해 ECR 에 올리고, 서버는 받아만 온다(서버에서 빌드하면 수십 분 · 메모리 부족).
#   - DB 포트를 바깥에 열지 않는다(같은 서버의 api 만 붙는다)
#   - 도메인 · DB 비밀번호는 /opt/jarviseo/.env, API 키 · 접속 비밀번호 해시는 /opt/jarviseo/secrets.env
#     (update.sh 가 Parameter Store 에서 받아 만든다). 둘 다 서버에만 있고 Git 에 없다.
#   - Caddy 가 80·443 을 받아 https 인증서를 알아서 발급 · 갱신하고, 접속 비밀번호를 확인한 뒤 api 로 넘긴다
#
# 서버에서 직접 돌릴 일은 거의 없다. main 에 머지되면 GitHub Actions 가 deploy/update.sh 를 부른다.
#     cd /opt/jarviseo/repo/deploy
#     docker compose --env-file /opt/jarviseo/.env --env-file /opt/jarviseo/secrets.env ps
#     docker compose --env-file /opt/jarviseo/.env --env-file /opt/jarviseo/secrets.env logs -f api

name: jarviseo

services:
  db:
    # 개발 · CI 와 같은 이미지. 스키마는 update.sh 가 schema.sql 로 맞춘다.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarviseo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?/opt/jarviseo/.env 에 DB_PASSWORD 가 없다}
      POSTGRES_DB: jarviseo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarviseo -d jarviseo"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    # 팀 웹 이미지. update.sh 가 WEB_IMAGE(ECR 주소:커밋)를 넘긴다.
    image: ${WEB_IMAGE:?WEB_IMAGE 가 없다 — update.sh 로 띄운다}
    restart: unless-stopped
    # 이 컨테이너가 쓸 수 있는 메모리 상한. 넘으면 이 컨테이너만 죽고 restart 로 다시 뜬다.
    # db · caddy 와 서버 전체가 같이 멈추는 것을 막는 안전망이다. 팀 웹은 10/24 로컬에서
    # Vision 으로 읽을 때 최고 580MiB 였다(#179). EasyOCR 로 떨어지면 3.1GiB 라 아래 설정으로 막는다.
    mem_limit: 1400m
    environment:
      # 팀 웹의 기록 · 알레르기 · 기억을 이 서버의 Postgres 에 둔다(기본은 컨테이너 안 SQLite 라 배포마다 사라진다).
      JARVISEO_API_DB: postgresql+psycopg://jarviseo:${DB_PASSWORD}@db:5432/jarviseo
      # Google Vision 이 실패해도 이 서버의 EasyOCR 로 대신 읽지 않는다(config.OCR_LOCAL_FALLBACK).
      # 대신 "지금은 성분표를 읽을 수 없어요" 라고 답한다. 비밀값이 아니라 여기 둔다.
      JARVISEO_OCR_LOCAL_FALLBACK: "false"
      # 키는 secrets.env 에서 온다. 없으면 빈 값 — VLM 은 "키가 없다"고 답하고, 성분표는 읽지 못한다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      JARVISEO_FOOD_QR_API_KEY: ${JARVISEO_FOOD_QR_API_KEY:-}
      # 노트북이 턴을 보낼 때 같이 보내는 토큰(#144). 없으면 POST /api/turns 가 503 으로 아무것도 안 받는다.
      JARVISEO_CLOUD_TOKEN: ${JARVISEO_CLOUD_TOKEN:-}
    # 질문 · 성분 확인 때 받은 사진을 남기는 폴더(assistant_web.PHOTO_DIR). 디스크에 쌓지 않고
    # 메모리에 두어 컨테이너를 다시 띄우면(배포마다) 사라지게 한다. 얼굴 · 집 안이 찍힐 수 있다.
    tmpfs:
      - /app/data/captures:size=200m
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?/opt/jarviseo/.env 에 DOMAIN 이 없다}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-jarviseo}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?secrets.env 에 BASIC_AUTH_HASH 가 없다 — update.sh 로 띄운다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 받은 인증서를 남겨 둔다. 지우면 다시 발급받는데, 너무 자주 받으면 발급 한도에 걸린다.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
