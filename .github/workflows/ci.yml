name: CI

# 담당: 문태현 (배포)
#
# PR 을 올리면 자동으로 돌고, 빨간불이면 머지 버튼이 잠긴다.
# (잠기게 하려면 GitHub 설정에서 이 체크를 필수로 등록해야 한다.
#  Settings → Branches → main → Require status checks to pass)
#
# OS 3종을 다 돌리는 이유
# ----------------------
# 맥 1대 + 윈도우 2대로 개발한다. encoding 누락, 경로 문자열 결합, 한글 파일명
# 같은 문제는 한쪽에서만 터진다. 사람이 조심하는 것보다 세 군데서 다 돌려보는
# 편이 확실하다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR 에 새 커밋을 올리면 이전 실행을 취소한다. Actions 시간을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 한 OS 가 실패해도 나머지는 끝까지 돌린다.
      # 맥만 깨졌는지 전부 깨졌는지를 한 번에 알아야 한다.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 로 확정 (강의에서 쓴 버전). pyproject.toml, Dockerfile 과 같이 맞춰둔 값이라
          # 바꿀 때는 세 곳을 함께 고칠 것.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 린트
        run: ruff check .

      - name: 포맷 검사
        run: ruff format --check .

      - name: 테스트
        run: pytest -q
