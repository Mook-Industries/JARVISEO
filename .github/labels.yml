# 라벨 정의 — 이 파일이 원본이다.
# main 에 push 되면 workflows/sync-labels.yml 이 GitHub 라벨을 여기 맞춘다.
# 웹 UI 에서 라벨을 만들지 말고 이 파일에 추가할 것.
#
# 접두어를 쓰지 않는 이유
# ---------------------
# 라벨이 여덟 개뿐이라 접두어로 걸러낼 이유가 없다.
# 오히려 "type: feature" 는 사이드바에서 두 줄로 접히고,
# 목록에서 전부 같은 글자로 시작해 눈으로 구분하기 어렵다.
#
# 이슈에는 종류 라벨 하나를 단다. 이슈 템플릿이 자동으로 붙인다.
# 담당자는 라벨이 아니라 Assignee 로 정한다.

# ── 종류 (이슈 템플릿이 자동으로 붙임) ────────────────────────────────
- name: "bug"
  color: "d73a4a"
  description: "동작하지 않는 것"

- name: "feature"
  color: "a2eeef"
  description: "새로 만드는 기능"

- name: "refactor"
  color: "1d76db"
  description: "동작은 그대로, 코드 구조 개선"

- name: "docs"
  color: "0075ca"
  description: "문서 — README, 회의록, 발표자료"

- name: "experiment"
  color: "fbca04"
  description: "모델 학습 · baseline 측정 · ablation"

- name: "chore"
  color: "cfd3d7"
  description: "설정, 빌드, 촬영·라벨링 등 그 외 작업"

# ── 상태 ──────────────────────────────────────────────────────────────
- name: "breaking"
  color: "b60205"
  description: "types.py / graph/state.py 변경 — 세 사람 코드가 전부 영향받음"

- name: "blocked"
  color: "d93f0b"
  description: "다른 작업이나 외부 요인(카메라 배송 등) 때문에 진행 불가"
