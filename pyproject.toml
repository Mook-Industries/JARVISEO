[project]
name = "jarviseo"
version = "0.1.0"
description = "자비서 (JARVISEO) — 안경형 AI 개인 비서"
# 3.12 로 확정. 강의에서 쓴 버전(3.12.5)이라 수업 코드가 그대로 돈다.
# 3.13 은 막아둔다. ultralytics·easyocr 같은 ML 패키지가 새 파이썬을 늦게
# 따라와서, wheel 이 없어 설치가 막히는 일이 생긴다.
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 실제 Postgres 가 있어야 도는 테스트. CI 의 db job 이 `pytest -m postgres` 로 이것만 돌린다.
markers = ["postgres: JARVISEO_TEST_DATABASE_URL 의 실제 Postgres(pgvector)에서 돈다"]
